name: 更新行情

on:
  schedule:
    - cron: "17 22 * * 1-5"   # 北京时间周二至周六 06:17
    - cron: "43 1 * * 2-6"    # 备用：北京时间周二至周六 09:43
  workflow_dispatch: {}        # 允许在 Actions 页面手动运行
  push:
    branches: [main]           # 你手动改了文件，也会重新发布网站

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - name: 更新行情数据
        if: github.event_name != 'push'
        run: python scripts/update_prices.py
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
      - name: 提交数据
        if: github.event_name != 'push'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: 行情更新 $(date -u +%F)"
            git pull --rebase
            git push
          fi
      - name: 打包网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
